name: Build Docker Container
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-requirements-txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: python3 -m pip install poetry

      - run: poetry install

      - run: poetry export --without-hashes -f requirements.txt --output requirements.txt

      - uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt

  build-and-publish-amd64:
    runs-on: ubuntu-latest
    needs: generate-requirements-txt
    outputs:
      amd64_digest: ${{ steps.build.outputs.digest }}   # ✅ fixed: now matches step id
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: requirements

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push amd64 image
        id: build   # ✅ step id matches job outputs
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/${{ github.repository }}:latest-amd64 \
            --push .
          DIGEST=$(docker buildx imagetools inspect --json ghcr.io/${{ github.repository }}:latest-amd64 | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT   # ✅ must be 'digest', not 'amd64_digest'

  build-and-publish-arm64:
    runs-on: ubuntu-24.04-arm
    needs: generate-requirements-txt
    outputs:
      arm64_digest: ${{ steps.build.outputs.digest }}   # ✅ fixed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: requirements

      - uses: docker/se
