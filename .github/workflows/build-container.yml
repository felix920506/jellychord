name: Build Docker Container
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-requirements-txt:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: install poetry
        run: python3 -m pip install poetry

      - name: install poetry dependencies
        run: poetry install

      - name: export requirements.txt
        run: poetry export --without-hashes -f requirements.txt --output requirements.txt

      - name: upload requirements.txt
        uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt

  build-and-publish-amd64:
    runs-on: ubuntu-latest
    needs: generate-requirements-txt
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download requirements.txt
        uses: actions/download-artifact@v5
        with:
          name: requirements

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build and push amd64 image
        id: build_amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/${{ github.repository }}:latest-amd64 \
            --push .
          # extract digest
          DIGEST=$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest-amd64 --format '{{.Digest}}')
          echo "amd64_digest=$DIGEST" >> $GITHUB_OUTPUT

  build-and-publish-arm64:
    runs-on: ubuntu-24.04-arm
    needs: generate-requirements-txt
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download requirements.txt
        uses: actions/download-artifact@v5
        with:
          name: requirements

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arm64 image
        id: build_arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag ghcr.io/${{ github.repository }}:latest-arm64 \
            --push .
          DIGEST=$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest-arm64 --format '{{.Digest}}')
          echo "arm64_digest=$DIGEST" >> $GITHUB_OUTPUT

  manifest:
    runs-on: ubuntu-latest
    needs: [build-and-publish-arm64, build-and-publish-amd64]
    steps:
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          AMD64_DIGEST=${{ needs.build-and-publish-amd64.outputs.amd64_digest }}
          ARM64_DIGEST=${{ needs.build-and-publish-arm64.outputs.arm64_digest }}
          echo "amd64 digest = $AMD64_DIGEST"
          echo "arm64 digest = $ARM64_DIGEST"

          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}@${AMD64_DIGEST} \
            ghcr.io/${{ github.repository }}@${ARM64_DIGEST}

      # (optional) Inspect / push / verify the manifest
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest

