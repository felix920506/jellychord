[tool.poetry]
name = "jellychord"
version = "0.1.0"
description = ""
authors = ["felix920506 <felix920506@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14, <3.15"
py-cord = {version = ">=2.8.1,<2.9.0", extras = ["voice"]}
# py-cord 2.8.1 accepts davey <1, but davey 0.2.0 changed how session keys are
# applied and py-cord doesn't follow it yet: the bot joins voice and sends audio
# nobody can decrypt (#86). Remove this line once a py-cord release supports
# davey 0.2: https://github.com/Pycord-Development/pycord/issues/3442
davey = ">=0.1.5,<0.2"
pyyaml = "^6.0.2"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
