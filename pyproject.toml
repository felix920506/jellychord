[tool.poetry]
name = "jellychord"
version = "0.1.0"
description = ""
authors = ["felix920506 <felix920506@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14, <3.15"
py-cord = {version = ">=2.8.1,<2.9.0", extras = ["voice"]}
# davey comes in through py-cord's voice extra, which accepts any version below
# 1. py-cord 2.8.1 can't use davey 0.2: the bot joins voice and sends audio
# nobody can decrypt (#86, https://github.com/Pycord-Development/pycord/issues/3442).
# Pinned here so that every davey update is its own PR, checked by the E2E tests.
davey = "0.1.5"
pyyaml = "^6.0.2"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
